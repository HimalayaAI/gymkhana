# hermes-function-calling-v1 (func_calling_singleturn) with the user request
# re-spoken in Nepali (voice-assistant style). Tool schemas and expected calls
# stay English; reward is exact tool-call match. Reasoning is captured as <think>.
name: multilingual-tool-use
source_format: hermes

llm:
  model: litellm:openai/gpt-5.6-luna-pro
  temperature: 0.2
  max_tokens: 4096

localizer_llm:
  model: litellm:openai/gpt-5.6-luna-pro
  temperature: 0.4
  max_tokens: 1024

localization:
  target_language: ne-Deva
  max_attempts: 1

dataset:
  dataset_name: NousResearch/hermes-function-calling-v1
  dataset_config: func_calling_singleturn
  dataset_split: train
  dataset_offset: 0
  limit: 1100
  batch_size: 8
  num_rollouts: 4
  output_dir: outputs/multilingual_tool_use/hermes_singleturn_nepali
  output_basename: hermes_singleturn_nepali
  output_sharegpt: true
  output_audit_jsonl: true
  enable_rewards: true
  reward_function: tool_call_match
