#Romanized Nepali (Latin script) variant of the hermes single-turn run.
# hermes-function-calling-v1 (func_calling_singleturn) with the user request
# re-spoken in Nepali (voice-assistant style). Tool schemas and expected calls
# stay English; reward is exact tool-call match. Reasoning is captured as <think>.
name: multilingual-tool-use
source_format: hermes
# english (default): models reason best in English and tool values stay verbatim.
# target | hybrid: ask the policy to think in Nepali (hybrid keeps English for
# tool names / values). Reasoning is captured from the provider and exported as <think>.
policy_reasoning: english

llm:
  model: litellm:openai/gpt-5.6-luna-pro
  temperature: 0.2
  max_tokens: 16384   # DeepSeek reasoning can exceed 4k before the call

localizer_llm:
  model: litellm:openai/gpt-5.6-luna-pro
  temperature: 0.4
  max_tokens: 1024

localization:
  target_language: ne-Latn
  max_attempts: 1

dataset:
  dataset_name: NousResearch/hermes-function-calling-v1
  dataset_config: func_calling_singleturn
  dataset_split: train
  dataset_offset: 0
  limit: 1100
  batch_size: 8
  num_rollouts: 4
  output_dir: outputs/multilingual_tool_use/hermes_singleturn_nepali_latn
  output_basename: hermes_singleturn_nepali_latn
  output_sharegpt: true
  output_audit_jsonl: true
  enable_rewards: true
  reward_function: tool_call_match
