[project]
name = "gymboard"
version = "0.1.0"
description = "Web dashboard for Gymkhana RL training data visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "HimalayaAI" },
  { name = "interstellarninja" }
]
license = { text = "MIT" }

dependencies = [
  "gymkhana>=0.1.0",
  "fastapi>=0.109",
  "uvicorn>=0.27",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
gymboard = "gymboard.__main__:main"

[project.urls]
Homepage = "https://github.com/HimalayaAI/gymkhana"
Repository = "https://github.com/HimalayaAI/gymkhana"
Documentation = "https://github.com/HimalayaAI/gymkhana/tree/main/gymboard"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gymboard*"]

[tool.setuptools.package-data]
gymboard = ["static/*"]
