[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepali-romanized-translator"
version = "0.1.0"
description = "Deterministic bidirectional transliteration for Devanagari and romanized Nepali"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
]

all = [
  "pytest>=8",
]

[project.scripts]
nepali-transliterate = "nepali_romanized_translator.transliterate:main"

[tool.setuptools.packages.find]
where = ["src"]
